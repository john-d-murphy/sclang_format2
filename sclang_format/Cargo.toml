[package]
name = "sclang_format"
version = "0.1.0"
edition = "2024"
# Not for crates.io: its license and repository are not stated here.
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.25"

[dev-dependencies]
assert_cmd = "2.0"
glob = "0.3"
pretty_assertions = "1.4"
insta = "1.39"
seq-macro = "0.3"

[build-dependencies]
cc = "1"

[features]
debug-tree = []

