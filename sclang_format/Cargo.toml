[package]
name = "sclang_format"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.25"
# tree-sitter-supercollider = { git = "https://github.com/john-d-murphy/tree-sitter-supercollider"}
tree-sitter-supercollider = { path = "../vendor/tree-sitter-supercollider" }

[dev-dependencies]
assert_cmd = "2.0"
glob = "0.3"
pretty_assertions = "1.4"
insta = "1.39"
seq-macro = "0.3"

[build-dependencies]
cc = "1"

[features]
debug-tree = []

